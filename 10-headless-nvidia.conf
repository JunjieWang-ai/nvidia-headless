# 无头(headless)模式: 向 NVIDIA 独显提供常驻假显示器(2560x1440 模板 EDID),
# 远程桌面(向日葵/ToDesk 等)在拔线状态下正常渲染。
# 安装位置: /etc/X11/xorg.conf.d/10-headless-nvidia.conf
# 注意: ModeValidation 宽松参数是必需的, 删掉会导致 X "no screens found" 无法启动。
# 接真实显示器前先执行: sudo headless off
Section "Device"
    Identifier "NVIDIA-card"
    Driver     "nvidia"
    Option     "ConnectedMonitor" "DFP-0"
    Option     "CustomEDID"       "DFP-0:/etc/X11/edid-headless.bin"
    Option     "ModeValidation"   "NoMaxPClkCheck, NoEdidMaxPClkCheck, NoHorizSyncCheck, NoVertRefreshCheck, NoTotalSizeCheck, AllowNonEDIDModes, AllowNon3DVisionModes"
    Option     "MetaModes"        "DFP-0:2560x1440_60"
EndSection

Section "Monitor"
    Identifier  "Headless-Monitor"
    HorizSync   30 - 96
    VertRefresh 50 - 76
    Modeline    "2560x1440_60" 241.50 2560 2608 2640 2720 1440 1443 1448 1481 -hsync +vsync
EndSection

Section "Screen"
    Identifier   "Headless-Screen"
    Device       "NVIDIA-card"
    Monitor      "Headless-Monitor"
    DefaultDepth 24
    Option       "AllowEmptyInitialConfiguration" "true"
    SubSection   "Display"
        Virtual  2560 1440
    EndSubSection
EndSection
